<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#12100C"/>
      <stop offset="1" stop-color="#1D1508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE7B"/>
      <stop offset="0.5" stop-color="#E0A83E"/>
      <stop offset="1" stop-color="#A8741F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6A844" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E6A844" stop-opacity="0"/>
    </radialGradient>
    <g id="note">
      <ellipse cx="0" cy="0" rx="7.5" ry="5.2" transform="rotate(-20 0 0)" fill="#E6A844"/>
      <rect x="5.6" y="-36" width="2.8" height="36" fill="#E6A844"/>
      <path d="M8.4,-36 C17,-32 19,-23 14.5,-14 C16,-25 12.5,-28.5 8.4,-29.5 Z" fill="#E6A844"/>
    </g>
    <clipPath id="frame"><rect x="4" y="4" width="992" height="102" rx="14"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="110" fill="url(#bgGrad)"/>
  <circle cx="880" cy="55" r="95" fill="url(#glow)"/>
  <rect x="4" y="4" width="992" height="102" fill="none" stroke="#C8912A" stroke-opacity="0.45" stroke-width="1.5" rx="14"/>

  <rect x="34" y="24" width="5" height="62" rx="2.5" fill="url(#goldGrad)"/>
  <text x="58" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="7" fill="url(#goldGrad)">TENTANG AKU</text>

  <g clip-path="url(#frame)">
    <rect x="-300" y="0" width="300" height="110" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1300 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(838,84) scale(0.85)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
      <use href="#note"/>
    </g>
  </g>
  <g transform="translate(902,80) scale(0.62)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" begin="0.9s" repeatCount="indefinite"/>
      <use href="#note"/>
    </g>
  </g>
  <g transform="translate(776,78) scale(0.5)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.4s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.4s" begin="0.4s" repeatCount="indefinite"/>
      <use href="#note"/>
    </g>
  </g>
</svg>
