<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="218" viewBox="0 0 1000 218">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#12100C"/>
      <stop offset="1" stop-color="#1D1508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE7B"/>
      <stop offset="0.5" stop-color="#E0A83E"/>
      <stop offset="1" stop-color="#A8741F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6A844" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#E6A844" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="4" y="4" width="992" height="210" rx="16"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="218" fill="url(#bgGrad)"/>
  <circle cx="500" cy="-40" r="200" fill="url(#glow)"/>
  <rect x="4" y="4" width="992" height="210" fill="none" stroke="#C8912A" stroke-opacity="0.45" stroke-width="1.5" rx="16"/>

  <!-- BLOK 1 -->
  <text x="137" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="url(#goldGrad)">4</text>
  <text x="137" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="12.5" letter-spacing="3" fill="#9BA3AF">REPOSITORI PUBLIK</text>

  <rect x="262" y="52" width="1.4" height="96" fill="#C8912A" opacity="0.3"/>

  <!-- BLOK 2 -->
  <text x="387" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="url(#goldGrad)">2</text>
  <text x="387" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="12.5" letter-spacing="3" fill="#9BA3AF">PENGIKUT</text>

  <rect x="512" y="52" width="1.4" height="96" fill="#C8912A" opacity="0.3"/>

  <!-- BLOK 3 -->
  <text x="637" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="url(#goldGrad)">3</text>
  <text x="637" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="12.5" letter-spacing="3" fill="#9BA3AF">MENGIKUTI</text>

  <rect x="762" y="52" width="1.4" height="96" fill="#C8912A" opacity="0.3"/>

  <!-- BLOK 4 -->
  <text x="881" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="url(#goldGrad)">2024</text>
  <text x="881" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="12.5" letter-spacing="3" fill="#9BA3AF">GABUNG GITHUB</text>

  <!-- Bar mini animasi di bawah -->
  <g fill="#C8912A">
    <rect x="440" y="176" width="9" height="16" rx="4">
      <animate attributeName="height" values="16;26;16" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="176;166;176" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="461" y="170" width="9" height="22" rx="4">
      <animate attributeName="height" values="22;30;18;22" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="170;162;174;170" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="482" y="178" width="9" height="14" rx="4">
      <animate attributeName="height" values="14;24;14" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="178;168;178" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="503" y="172" width="9" height="20" rx="4">
      <animate attributeName="height" values="20;28;20" dur="1.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="172;164;172" dur="1.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="524" y="177" width="9" height="15" rx="4">
      <animate attributeName="height" values="15;22;15" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="177;170;177" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="428" y="192" width="117" height="1.6" fill="#C8912A" opacity="0.45"/>

  <g clip-path="url(#frame)">
    <rect x="-300" y="0" width="300" height="218" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1300 0" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
