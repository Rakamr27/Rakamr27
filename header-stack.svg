<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#12100C"/>
      <stop offset="1" stop-color="#1D1508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE7B"/>
      <stop offset="0.5" stop-color="#E0A83E"/>
      <stop offset="1" stop-color="#A8741F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6A844" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E6A844" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="4" y="4" width="992" height="102" rx="14"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="110" fill="url(#bgGrad)"/>
  <circle cx="880" cy="55" r="95" fill="url(#glow)"/>
  <rect x="4" y="4" width="992" height="102" fill="none" stroke="#C8912A" stroke-opacity="0.45" stroke-width="1.5" rx="14"/>

  <rect x="34" y="24" width="5" height="62" rx="2.5" fill="url(#goldGrad)"/>
  <text x="58" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="7" fill="url(#goldGrad)">TECH STACK</text>

  <g clip-path="url(#frame)">
    <rect x="-300" y="0" width="300" height="110" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1300 0" dur="4.5s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Equalizer besar di kanan -->
  <g fill="#C8912A">
    <rect x="742" y="58" width="13" height="30" rx="6">
      <animate attributeName="height" values="30;58;22;30" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="58;30;66;58" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="768" y="44" width="13" height="44" rx="6">
      <animate attributeName="height" values="44;64;30;44" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="44;24;58;44" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="794" y="64" width="13" height="24" rx="6">
      <animate attributeName="height" values="24;52;24" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="64;36;64" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="820" y="50" width="13" height="38" rx="6">
      <animate attributeName="height" values="38;62;38" dur="1.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="50;26;50" dur="1.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="846" y="60" width="13" height="28" rx="6">
      <animate attributeName="height" values="28;48;20;28" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="60;40;68;60" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="872" y="46" width="13" height="42" rx="6">
      <animate attributeName="height" values="42;26;56;42" dur="1.45s" repeatCount="indefinite"/>
      <animate attributeName="y" values="46;62;32;46" dur="1.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="898" y="56" width="13" height="32" rx="6">
      <animate attributeName="height" values="32;54;32" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="56;34;56" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="736" y="88" width="182" height="2" fill="#C8912A" opacity="0.5"/>
</svg>
