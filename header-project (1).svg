<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#12100C"/>
      <stop offset="1" stop-color="#1D1508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE7B"/>
      <stop offset="0.5" stop-color="#E0A83E"/>
      <stop offset="1" stop-color="#A8741F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6A844" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E6A844" stop-opacity="0"/>
    </radialGradient>
    <path id="orbit" d="M 770 78 L 820 58 L 862 62 L 908 30" fill="none"/>
    <clipPath id="frame"><rect x="4" y="4" width="992" height="102" rx="14"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="110" fill="url(#bgGrad)"/>
  <circle cx="880" cy="55" r="95" fill="url(#glow)"/>
  <rect x="4" y="4" width="992" height="102" fill="none" stroke="#C8912A" stroke-opacity="0.45" stroke-width="1.5" rx="14"/>

  <rect x="34" y="24" width="5" height="62" rx="2.5" fill="url(#goldGrad)"/>
  <text x="58" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="7" fill="url(#goldGrad)">PROJECT PILIHAN</text>

  <g clip-path="url(#frame)">
    <rect x="-300" y="0" width="300" height="110" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1300 0" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Tangga naik + titik cahaya berjalan -->
  <use href="#orbit" stroke="#C8912A" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 6"/>
  <g fill="#F7CE7B">
    <circle cx="770" cy="78" r="4"/>
    <circle cx="820" cy="58" r="4"/>
    <circle cx="862" cy="62" r="4"/>
    <circle cx="908" cy="30" r="4"/>
  </g>
  <circle r="6" fill="#F7CE7B">
    <animateMotion dur="3.2s" repeatCount="indefinite">
      <mpath href="#orbit"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0.2;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Bintang berkedip -->
  <g fill="#F7CE7B">
    <circle cx="716" cy="30" r="2.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="72" r="2"><animate attributeName="opacity" values="1;0.15;1" dur="2.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="756" cy="94" r="1.7"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.1s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="952" cy="24" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
