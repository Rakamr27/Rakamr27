<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#12100C"/>
      <stop offset="1" stop-color="#1D1508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE7B"/>
      <stop offset="0.5" stop-color="#E0A83E"/>
      <stop offset="1" stop-color="#A8741F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6A844" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E6A844" stop-opacity="0"/>
    </radialGradient>
    <g id="note">
      <ellipse cx="0" cy="0" rx="7.5" ry="5.2" transform="rotate(-20 0 0)" fill="#E6A844"/>
      <rect x="5.6" y="-36" width="2.8" height="36" fill="#E6A844"/>
      <path d="M8.4,-36 C17,-32 19,-23 14.5,-14 C16,-25 12.5,-28.5 8.4,-29.5 Z" fill="#E6A844"/>
    </g>
    <g id="note2">
      <ellipse cx="0" cy="0" rx="7.5" ry="5.2" transform="rotate(-20 0 0)" fill="#E6A844"/>
      <ellipse cx="26" cy="4" rx="7.5" ry="5.2" transform="rotate(-20 26 4)" fill="#E6A844"/>
      <rect x="5.6" y="-32" width="2.8" height="32" fill="#E6A844"/>
      <rect x="31.6" y="-28" width="2.8" height="32" fill="#E6A844"/>
      <path d="M5.6,-32 L34.4,-28 L34.4,-19 L5.6,-23 Z" fill="#E6A844"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1000" height="320" fill="url(#bgGrad)"/>
  <circle cx="800" cy="150" r="230" fill="url(#glow)"/>
  <circle cx="90" cy="300" r="150" fill="url(#glow)"/>
  <rect x="10" y="10" width="980" height="300" fill="none" stroke="#C8912A" stroke-opacity="0.45" stroke-width="1.5" rx="14"/>

  <!-- Teks kiri -->
  <text x="72" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="74" letter-spacing="12" fill="url(#goldGrad)">RAKA</text>
  <rect x="76" y="146" width="186" height="2.5" fill="#C8912A"/>
  <text x="76" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="21" letter-spacing="7" fill="#D8C9A3">RAKAMR27</text>
  <text x="76" y="224" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#9BA3AF">Code &#8212; Coffee &#8212; Guitar</text>
  <text x="76" y="256" font-family="Verdana, sans-serif" font-size="11" letter-spacing="4" fill="#6E7683">INFORMATICS ENGINEERING STUDENT</text>

  <!-- Bar equalizer animasi di kiri bawah -->
  <g fill="#C8912A">
    <rect x="76" y="266" width="6" height="12" rx="3">
      <animate attributeName="height" values="12;30;12" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="266;248;266" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="258" width="6" height="20" rx="3">
      <animate attributeName="height" values="20;36;14;20" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="258;242;264;258" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="104" y="270" width="6" height="8" rx="3">
      <animate attributeName="height" values="8;26;8" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="270;252;270" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="118" y="262" width="6" height="16" rx="3">
      <animate attributeName="height" values="16;32;16" dur="1.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="262;246;262" dur="1.25s" repeatCount="indefinite"/>
    </rect>
    <rect x="132" y="268" width="6" height="10" rx="3">
      <animate attributeName="height" values="10;22;10" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="268;256;268" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Gitar -->
  <g transform="translate(790,168) rotate(24)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="6s" repeatCount="indefinite"/>
      <!-- leher & kepala -->
      <rect x="-10" y="-148" width="20" height="122" fill="#241A10" stroke="#C8912A" stroke-width="1"/>
      <g stroke="#C8912A" stroke-opacity="0.35">
        <line x1="-10" y1="-132" x2="10" y2="-132"/>
        <line x1="-10" y1="-112" x2="10" y2="-112"/>
        <line x1="-10" y1="-92" x2="10" y2="-92"/>
        <line x1="-10" y1="-72" x2="10" y2="-72"/>
        <line x1="-10" y1="-52" x2="10" y2="-52"/>
      </g>
      <rect x="-14" y="-188" width="28" height="42" rx="7" fill="#171008" stroke="#C8912A" stroke-width="1"/>
      <g fill="#E6A844">
        <circle cx="-19" cy="-178" r="2.6"/><circle cx="19" cy="-178" r="2.6"/>
        <circle cx="-19" cy="-165" r="2.6"/><circle cx="19" cy="-165" r="2.6"/>
        <circle cx="-19" cy="-152" r="2.6"/><circle cx="19" cy="-152" r="2.6"/>
      </g>
      <!-- badan -->
      <ellipse cx="0" cy="4" rx="57" ry="52" fill="url(#goldGrad)"/>
      <ellipse cx="0" cy="64" rx="80" ry="64" fill="url(#goldGrad)"/>
      <circle cx="0" cy="30" r="24" fill="none" stroke="#0B0E14" stroke-opacity="0.35" stroke-width="2"/>
      <circle cx="0" cy="30" r="18" fill="#0B0E14"/>
      <ellipse cx="27" cy="50" rx="14" ry="9" fill="#171008" opacity="0.85" transform="rotate(30 27 50)"/>
      <rect x="-22" y="80" width="44" height="9" rx="3" fill="#171008"/>
      <!-- senar -->
      <g stroke="#F9EECB" stroke-width="1" opacity="0.85">
        <line x1="-5" y1="-184" x2="-5" y2="82"/>
        <line x1="0" y1="-184" x2="0" y2="82"/>
        <line x1="5" y1="-184" x2="5" y2="82"/>
      </g>
    </g>
  </g>

  <!-- Not musik melayang -->
  <g transform="translate(622,110)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -26;0 0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" repeatCount="indefinite"/>
      <use href="#note"/>
    </g>
  </g>
  <g transform="translate(896,132) scale(0.8)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -20;0 0" dur="5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" begin="0.8s" repeatCount="indefinite"/>
      <use href="#note2"/>
    </g>
  </g>
  <g transform="translate(664,262) scale(0.7)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="4.6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.6s" begin="0.4s" repeatCount="indefinite"/>
      <use href="#note"/>
    </g>
  </g>
  <g transform="translate(914,248) scale(0.9)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -24;0 0" dur="5.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;1;0.25" dur="5.4s" begin="1.2s" repeatCount="indefinite"/>
      <use href="#note"/>
    </g>
  </g>

  <!-- Bintang kecil berkedip -->
  <g fill="#F7CE7B">
    <circle cx="560" cy="60" r="2.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="180" r="1.8"><animate attributeName="opacity" values="1;0.15;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="120" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="52" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
