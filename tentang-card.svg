<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="412" viewBox="0 0 1000 412">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#12100C"/>
      <stop offset="1" stop-color="#1D1508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE7B"/>
      <stop offset="0.5" stop-color="#E0A83E"/>
      <stop offset="1" stop-color="#A8741F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6A844" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E6A844" stop-opacity="0"/>
    </radialGradient>
    <g id="note">
      <ellipse cx="0" cy="0" rx="7.5" ry="5.2" transform="rotate(-20 0 0)" fill="#E6A844"/>
      <rect x="5.6" y="-36" width="2.8" height="36" fill="#E6A844"/>
      <path d="M8.4,-36 C17,-32 19,-23 14.5,-14 C16,-25 12.5,-28.5 8.4,-29.5 Z" fill="#E6A844"/>
    </g>
    <clipPath id="frame"><rect x="4" y="4" width="992" height="404" rx="16"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="412" fill="url(#bgGrad)"/>
  <circle cx="930" cy="30" r="170" fill="url(#glow)"/>
  <circle cx="40" cy="330" r="140" fill="url(#glow)"/>
  <rect x="4" y="4" width="992" height="404" fill="none" stroke="#C8912A" stroke-opacity="0.45" stroke-width="1.5" rx="16"/>

  <!-- JUDUL -->
  <rect x="36" y="18" width="5" height="38" rx="2.5" fill="url(#goldGrad)"/>
  <text x="56" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="29" letter-spacing="5" fill="url(#goldGrad)">TENTANG AKU</text>
  <rect x="36" y="66" width="928" height="1.4" fill="#C8912A" opacity="0.35"/>
  <g transform="translate(0,64)">

  <!-- BARIS 1: Pendidikan -->
  <g>
    <rect x="36" y="26" width="46" height="46" rx="12" fill="#171208" stroke="#C8912A" stroke-opacity="0.6"/>
    <g transform="translate(59,49)">
      <polygon points="0,-11 19,0 0,11 -19,0" fill="url(#goldGrad)"/>
      <path d="M-10,4 L-10,12 C-10,16 10,16 10,12 L10,4 L0,9 Z" fill="#E0A83E" opacity="0.85"/>
      <line x1="19" y1="0" x2="19" y2="12" stroke="#E6A844" stroke-width="2"/>
      <circle cx="19" cy="14" r="2.4" fill="#E6A844"/>
    </g>
    <text x="102" y="57" font-family="Verdana, sans-serif" font-size="16.5" fill="#C9D1D9">Mahasiswa <tspan font-weight="bold" fill="#F5EFDD">Teknik Informatika</tspan> di <tspan font-weight="bold" fill="#F5EFDD">Universitas Pamulang</tspan></text>
  </g>

  <!-- BARIS 2: Fokus -->
  <g>
    <rect x="36" y="84" width="46" height="46" rx="12" fill="#171208" stroke="#C8912A" stroke-opacity="0.6"/>
    <text x="59" y="116" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="17" fill="#E6A844">&lt;/&gt;</text>
    <text x="102" y="115" font-family="Verdana, sans-serif" font-size="16.5" fill="#C9D1D9">Fokus belajar <tspan font-weight="bold" fill="#F5EFDD">Pemrograman Web</tspan> dan <tspan font-weight="bold" fill="#F5EFDD">Machine Learning</tspan></text>
  </g>

  <!-- BARIS 3: Citra -->
  <g>
    <rect x="36" y="142" width="46" height="46" rx="12" fill="#171208" stroke="#C8912A" stroke-opacity="0.6"/>
    <g transform="translate(59,165)">
      <rect x="-14" y="-11" width="28" height="22" rx="3" fill="none" stroke="#E6A844" stroke-width="2"/>
      <circle cx="-6" cy="-4" r="2.6" fill="#E6A844"/>
      <polyline points="-14,8 -5,-1 2,5 7,0 14,8" fill="none" stroke="#E6A844" stroke-width="2"/>
    </g>
    <text x="102" y="173" font-family="Verdana, sans-serif" font-size="16.5" fill="#C9D1D9">Mendalami <tspan font-weight="bold" fill="#F5EFDD">Pengolahan Citra Digital</tspan> dan <tspan font-weight="bold" fill="#F5EFDD">Deep Learning (PyTorch)</tspan></text>
  </g>

  <!-- BARIS 4: SPK (2 baris teks) -->
  <g>
    <rect x="36" y="200" width="46" height="46" rx="12" fill="#171208" stroke="#C8912A" stroke-opacity="0.6"/>
    <g transform="translate(59,223)" stroke="#E6A844" stroke-width="1.8">
      <line x1="-11" y1="8" x2="0" y2="-9"/>
      <line x1="11" y1="8" x2="0" y2="-9"/>
      <line x1="-11" y1="8" x2="11" y2="8"/>
      <circle cx="0" cy="-9" r="3.4" fill="#E6A844" stroke="none"/>
      <circle cx="-11" cy="8" r="3.4" fill="#E6A844" stroke="none"/>
      <circle cx="11" cy="8" r="3.4" fill="#E6A844" stroke="none"/>
    </g>
    <text x="102" y="222" font-family="Verdana, sans-serif" font-size="16.5" fill="#C9D1D9">Lagi eksplorasi <tspan font-weight="bold" fill="#F5EFDD">SPK (SAW / TOPSIS / SMART)</tspan>, klasifikasi data,</text>
    <text x="102" y="248" font-family="Verdana, sans-serif" font-size="16.5" fill="#C9D1D9">dan bikin website yang tampilannya nggak asal jadi</text>
  </g>

  <!-- BARIS 5: Gitar -->
  <g>
    <rect x="36" y="272" width="46" height="46" rx="12" fill="#171208" stroke="#C8912A" stroke-opacity="0.6"/>
    <g transform="translate(52,312) scale(0.78)">
      <use href="#note"/>
    </g>
    <text x="102" y="303" font-family="Verdana, sans-serif" font-size="16.5" fill="#C9D1D9">Di luar coding: <tspan font-weight="bold" fill="#F5EFDD">main gitar</tspan>, dan lagi nyoba trading</text>
  </g>

  </g>

  <g clip-path="url(#frame)">
    <rect x="-300" y="0" width="300" height="412" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1300 0" dur="5.5s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
