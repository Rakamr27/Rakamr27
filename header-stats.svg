<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#12100C"/>
      <stop offset="1" stop-color="#1D1508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE7B"/>
      <stop offset="0.5" stop-color="#E0A83E"/>
      <stop offset="1" stop-color="#A8741F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6A844" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E6A844" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="4" y="4" width="992" height="102" rx="14"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="110" fill="url(#bgGrad)"/>
  <circle cx="880" cy="55" r="95" fill="url(#glow)"/>
  <rect x="4" y="4" width="992" height="102" fill="none" stroke="#C8912A" stroke-opacity="0.45" stroke-width="1.5" rx="14"/>

  <rect x="34" y="24" width="5" height="62" rx="2.5" fill="url(#goldGrad)"/>
  <text x="58" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="7" fill="url(#goldGrad)">STATISTIK GITHUB</text>

  <g clip-path="url(#frame)">
    <rect x="-300" y="0" width="300" height="110" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1300 0" dur="4.5s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Grafik batang bergerak -->
  <g>
    <rect x="748" y="56" width="20" height="32" rx="3" fill="url(#goldGrad)" opacity="0.55">
      <animate attributeName="height" values="32;44;32" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="56;44;56" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="780" y="42" width="20" height="46" rx="3" fill="url(#goldGrad)" opacity="0.75">
      <animate attributeName="height" values="46;58;46" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="42;30;42" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="812" y="62" width="20" height="26" rx="3" fill="url(#goldGrad)" opacity="0.45">
      <animate attributeName="height" values="26;38;26" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="62;50;62" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="844" y="34" width="20" height="54" rx="3" fill="url(#goldGrad)" opacity="0.9">
      <animate attributeName="height" values="54;66;54" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="34;22;34" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="876" y="50" width="20" height="38" rx="3" fill="url(#goldGrad)" opacity="0.65">
      <animate attributeName="height" values="38;50;38" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="50;38;50" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="740" y="88" width="164" height="2" fill="#C8912A" opacity="0.5"/>
</svg>
