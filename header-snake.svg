<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#12100C"/>
      <stop offset="1" stop-color="#1D1508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CE7B"/>
      <stop offset="0.5" stop-color="#E0A83E"/>
      <stop offset="1" stop-color="#A8741F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6A844" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E6A844" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="4" y="4" width="992" height="102" rx="14"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="110" fill="url(#bgGrad)"/>
  <circle cx="880" cy="55" r="95" fill="url(#glow)"/>
  <rect x="4" y="4" width="992" height="102" fill="none" stroke="#C8912A" stroke-opacity="0.45" stroke-width="1.5" rx="14"/>

  <rect x="34" y="24" width="5" height="62" rx="2.5" fill="url(#goldGrad)"/>
  <text x="58" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="33" letter-spacing="4" fill="url(#goldGrad)">KONTRIBUSIKU DIMAKAN ULAR</text>

  <g clip-path="url(#frame)">
    <rect x="-300" y="0" width="300" height="110" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1300 0" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Grid kontribusi + ular emas yang lewat berurutan -->
  <g>
    <!-- baris 1 -->
    <rect x="742" y="26" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <rect x="766" y="26" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;0.22" dur="3s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="790" y="26" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;0.22" dur="3s" begin="0.25s" repeatCount="indefinite"/></rect>
    <rect x="814" y="26" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;0.22" dur="3s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="838" y="26" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;0.22" dur="3s" begin="0.75s" repeatCount="indefinite"/></rect>
    <rect x="862" y="26" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <rect x="886" y="26" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <!-- baris 2 -->
    <rect x="742" y="48" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <rect x="766" y="48" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <rect x="790" y="48" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <rect x="814" y="48" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;0.22" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="838" y="48" width="15" height="15" rx="3" fill="#F7CE7B" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" begin="1.25s" repeatCount="indefinite"/></rect>
    <rect x="862" y="48" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <rect x="886" y="48" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <!-- baris 3 -->
    <rect x="742" y="70" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <rect x="766" y="70" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;0.22" dur="3s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="790" y="70" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;0.22" dur="3s" begin="1.75s" repeatCount="indefinite"/></rect>
    <rect x="814" y="70" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22">
      <animate attributeName="opacity" values="0.22;1;0.22" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
    <rect x="838" y="70" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <rect x="862" y="70" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
    <rect x="886" y="70" width="15" height="15" rx="3" fill="#C8912A" opacity="0.22"/>
  </g>
</svg>
